name: Build TWRP
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3

    - name: Repo Init
      run: |
        git config --global user.name "nonoobik"
        git config --global user.email "nonoobik@example.com"
        curl https://googleapis.com > ~/repo
        chmod a+x ~/repo
        mkdir ~/twrp && cd ~/twrp
        ~/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
        ~/repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Tree
      run: |
        mkdir -p ~/twrp/device/infinix/X6716
        cp -r * ~/twrp/device/infinix/X6716/

    - name: Make
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_Infinix-X6716-eng || lunch omni_Infinix-X6716-eng
        make recoveryimage -j$(nproc --all)

    - name: Save
      uses: actions/upload-artifact@v3
      with:
        name: TWRP_Infinix_X6716
        path: ~/twrp/out/target/product/Infinix-X6716/recovery.img
