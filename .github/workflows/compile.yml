name: Сборка TWRP для Infinix Note 30i

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Подготовка сервера
      uses: actions/checkout@v4

    - name: Установка инструментов компиляции
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Скачивание исходников TWRP напрямую
      run: |
        git clone --depth=1 "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" -b twrp-12.1 ~/twrp
        git clone --depth=1 "https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git" -b twrp-12.1 ~/twrp/build

    - name: Клонирование твоего дерева устройства
      run: |
        mkdir -p ~/twrp/device/infinix/X6716
        cp -r * ~/twrp/device/infinix/X6716/

    - name: Запуск компиляции рекавери
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_Infinix-X6716-eng || lunch omni_Infinix-X6716-eng
        make recoveryimage -j$(nproc --all)

    - name: Загрузка готового TWRP на GitHub
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_Infinix_Note30i_v1992RU
        path: ~/twrp/out/target/product/Infinix-X6716/recovery.img
        
