name: Сборка TWRP для Infinix Note 30i

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Очистка и подготовка сервера
      uses: actions/checkout@v3

    - name: Установка инструментов компиляции
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: Установка утилиты Repo
      run: |
        mkdir -p ~/bin
        curl https://googleapis.com > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Скачивание исходников TWRP 12.1
      run: |
        export PATH=~/bin:$PATH
        mkdir ~/twrp && cd ~/twrp
        repo init --depth=1 -u https://github.com -b twrp-12.1
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Клонирование твоего дерева устройства
      run: |
        mkdir -p ~/twrp/device/infinix/X6716
        cp -r * ~/twrp/device/infinix/X6716/

    - name: Запуск компиляции рекавери
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch twrp_Infinix-X6716-eng || lunch omni_Infinix-X6716-eng
        make recoveryimage -j$(nproc --all)

    - name: Загрузка готового TWRP на GitHub
      uses: actions/upload-artifact@v3
      with:
        name: TWRP_Infinix_Note30i_v1992RU
        path: ~/twrp/out/target/product/Infinix-X6716/recovery.img
